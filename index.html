<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Caveat:wght@400;700&family=Caveat+Brush&family=Vazirmatn:wght@400;600;900&display=swap">
<style>
:root{--gold:#ffc933;--ink:#fff4e0;--dim:rgba(255,244,224,.68);--glass:rgba(14,12,22,.55);--line:rgba(255,255,255,.16);--bg:#0b0a14;--r:22px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','Vazirmatn',system-ui,sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] select{font-family:'Vazirmatn','Plus Jakarta Sans',sans-serif}
button,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

#bg{position:fixed;inset:0;background-size:cover;background-position:center;transition:filter 1s,transform 8s}

#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,5,14,.45),rgba(6,5,14,.04) 30%,rgba(6,5,14,.55));transition:background 1s}

#app{position:relative;height:100%;display:flex;flex-direction:column;padding:14px clamp(12px,3vw,40px)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;min-height:0}
h1{font-family:'Caveat',cursive;font-size:clamp(54px,9.5vw,140px);line-height:.95;font-weight:700;text-shadow:0 6px 40px rgba(0,0,0,.55);transition:.6s}
h1 em{color:var(--gold);font-style:normal}
[dir=rtl] h1{font-family:'Vazirmatn';font-weight:900;font-size:clamp(46px,8vw,118px);line-height:1.2}
.sub{color:var(--dim);font-size:clamp(15px,1.6vw,20px);margin-top:10px;transition:.5s}
body.busy h1,body.busy .sub,body.show h1,body.show .sub{opacity:0;height:0;overflow:hidden;margin:0;font-size:0}
.orbwrap{margin-top:clamp(18px,4vh,44px);display:flex;flex-direction:column;align-items:center;gap:14px;transition:.5s}
body.busy .orbwrap,body.show .orbwrap{display:none}
#go{width:clamp(130px,17vw,190px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#1a1424,#0a0812);box-shadow:0 0 60px rgba(255,201,51,.45),inset 0 0 30px rgba(255,201,51,.15);transition:transform .3s}
#go:hover{transform:scale(1.06)}
#go::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--gold),transparent 40%,var(--gold) 60%,transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:rot 6s linear infinite}
#go::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--gold);animation:ping 2.6s ease-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#go svg{width:46%;color:var(--gold);filter:drop-shadow(0 0 10px var(--gold))}
.cta{font-weight:800;font-size:clamp(18px,2vw,24px);letter-spacing:.02em}
.hint{font-size:12px;color:var(--dim)}
#stage{position:absolute;inset:0;display:none}
body.busy #stage{display:block}
#cv{width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#cnt{font-size:clamp(90px,20vw,240px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 60px rgba(255,201,51,.4)}
#cnt.tick{animation:tk .3s}
@keyframes tk{from{transform:scale(1.12);color:var(--gold)}}
#st{font-size:clamp(13px,1.6vw,18px);letter-spacing:.18em;color:var(--gold);margin-top:6px;font-weight:600}
[dir=rtl] #st{letter-spacing:0}
.cd{position:absolute;padding:8px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:13px;text-align:start;white-space:nowrap;animation:cdin .9s forwards;pointer-events:none}
.cd b{display:block;font-size:14px}.cd i{font-style:normal;color:var(--dim);font-size:11px}
@keyframes cdin{0%{opacity:0;transform:scale(.8);filter:blur(6px)}25%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translateY(-14px);filter:blur(4px)}}
#res{display:none;width:min(94vw,720px);max-height:100%;overflow:auto;text-align:start}

.card{position:relative;overflow:hidden;border-radius:28px;background:rgba(16,13,26,.82);backdrop-filter:blur(24px);border:1px solid rgba(255,201,51,.45);box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 80px rgba(255,201,51,.18)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 1.4s .3s ease-out forwards;pointer-events:none}
[dir=rtl] .card::after{transform:translateX(120%);animation-name:sweepr}

.ph{height:clamp(110px,22vh,200px);display:grid;place-items:center;font-size:90px;font-weight:800;color:rgba(255,255,255,.85);position:relative}

.cb{padding:20px 24px 22px}
.it{color:var(--gold);font-family:'Caveat',cursive;font-size:30px}[dir=rtl] .it{font-family:'Vazirmatn';font-weight:900;font-size:22px}

.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--dim);font-size:14px}.meta b{color:var(--ink)}
.proof{display:flex;gap:18px;margin-top:14px;padding:10px 14px;border:1px dashed var(--line);border-radius:14px;font-size:12px;color:var(--dim);flex-wrap:wrap}.proof b{color:var(--gold);font-variant-numeric:tabular-nums}
.nt{margin-top:14px;font-weight:800;font-size:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts button{padding:11px 18px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px}
.acts .pri{background:var(--gold);color:#201600;border-color:var(--gold);font-weight:800}
.demo{font-size:10px;color:var(--dim);margin-top:10px}
.dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(92vw,380px);background:rgba(14,12,22,.93);backdrop-filter:blur(24px);border-inline-start:1px solid var(--line);z-index:30;padding:20px;transform:translateX(105%);transition:transform .35s;overflow:auto}
[dir=rtl] .dr{transform:translateX(-105%)}
.dr.on{transform:none!important}
.dr h3{margin-bottom:12px}
.hi{padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;font-size:13px;color:var(--dim)}.hi b{color:var(--ink);font-size:15px;display:block}
.md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:none;place-items:center;padding:20px}
.md.on{display:grid}
.md div{background:#15121f;border:1px solid var(--line);border-radius:22px;padding:26px;max-width:380px;text-align:center}
.md p{margin:8px 0 18px;color:var(--dim)}
.empty{display:none;text-align:center}.empty h2{font-size:clamp(26px,4vw,40px);margin-bottom:14px}

body.rm *{animation-duration:.01s!important;transition-duration:.01s!important}

header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;position:relative;z-index:10;transition:opacity .5s,transform .5s}

.logo{position:relative;font-family:'Caveat Brush','Caveat',cursive;font-size:40px;line-height:1;transform:skewX(-7deg);white-space:nowrap;padding-top:16px;text-shadow:0 3px 14px rgba(0,0,0,.5)}

.crown{position:absolute;top:-4px;left:30px;width:30px;color:var(--gold)}
.sw{position:absolute;left:8px;right:0;bottom:-8px;height:3px;border-radius:3px;background:var(--gold);transform:rotate(-3deg)}
.bar{display:flex;width:100%;max-width:720px;justify-self:center;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.f{position:relative;flex:1;min-width:0}
.f+.f::before{content:"";position:absolute;inset-inline-start:0;top:20%;bottom:20%;width:1px;background:var(--line)}
.fb{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;border-radius:999px;text-align:start}
.fb:hover{background:rgba(255,255,255,.06)}
.fb .ic{color:var(--gold);width:22px;height:22px;flex:none}
.fb .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.fb small{font-size:11px;color:var(--dim)}
.fv{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb .ch{width:16px;height:16px;opacity:.7;flex:none}
.ic svg,.ch svg{width:100%;height:100%;display:block}
.pop{position:absolute;top:calc(100% + 12px);inset-inline-start:0;z-index:20;width:max(100%,290px);display:none;background:rgba(16,13,26,.95);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.pop.on{display:block;animation:pin .2s}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}}
.ps{width:100%;padding:10px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-size:14px}

.pl{max-height:min(280px,40vh);overflow:auto;overscroll-behavior:contain}
.o{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 12px;border-radius:12px;font-size:14px;color:var(--dim);text-align:start}
.o:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.o.on{color:#201600;background:var(--gold);font-weight:600}

.no{padding:12px;color:var(--dim);font-size:13px}
.tools{display:flex;align-items:center;gap:4px;justify-self:end}
.ib{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 14px;font-size:11px;color:var(--dim)}
.ib:hover{color:var(--ink)}.ib .ic{width:22px;height:22px;color:var(--ink)}
.ib+.ib{border-inline-start:1px solid var(--line)}
.lg{margin-inline-start:8px;font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}.lg b{color:var(--gold)}
.tb{padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600}.tb.on{background:var(--gold);color:#201600;border-color:var(--gold)}
.orb{position:relative;width:clamp(230px,26vw,340px);aspect-ratio:1;display:grid;place-items:center}
.fd{position:absolute;font-size:clamp(30px,4vw,48px);filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:fl 5s ease-in-out infinite}
.fd:nth-child(1){top:8%;left:6%}.fd:nth-child(2){top:6%;right:4%;animation-delay:-1s}.fd:nth-child(3){bottom:12%;right:6%;animation-delay:-2s}.fd:nth-child(4){bottom:10%;left:4%;animation-delay:-3s}
@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}
.or{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(255,201,51,.5);stroke-width:.5;animation:rot 24s linear infinite;pointer-events:none}
.pill{display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);font-weight:700;font-size:15px}
.pill::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);border-top-color:transparent;animation:rot 1.4s linear infinite}
.note{position:absolute;font-family:'Caveat',cursive;font-size:clamp(20px,2.2vw,30px);line-height:1.05;color:var(--ink);text-shadow:0 2px 10px rgba(0,0,0,.6);border-bottom:3px solid var(--gold);padding-bottom:8px;border-radius:0 0 40px 0;transition:opacity .5s;pointer-events:none}
.n1{left:3%;top:44%;transform:rotate(-16deg)}.n2{right:3%;top:26%;transform:rotate(-14deg)}.n3{right:3%;bottom:6%;transform:rotate(-18deg)}
body.busy .note,body.show .note{opacity:0}
h1{font-family:'Caveat Brush','Caveat',cursive;transform:skewX(-6deg)}
[dir=rtl] h1{transform:none}
h1 .w{position:relative;display:inline-block}
h1 .w::after{content:"";position:absolute;left:6%;right:4%;bottom:-4px;height:6px;border-radius:6px;background:var(--gold);transform:rotate(-1.5deg)}
@media(max-width:820px){header{grid-template-columns:1fr auto;gap:10px}.logo{font-size:32px}.bar{grid-column:1/-1;grid-row:2}.fb{padding:8px 10px;gap:6px}.fb .ic,.fb .ch{display:none}.ib span,.note{display:none}.ib{padding:4px 8px}.pop{position:fixed;inset-inline:12px;width:auto}h1{font-size:clamp(46px,14vw,90px)}.orb{width:230px}}
.yt{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#ff0033;color:#fff;font-weight:700;font-size:13px;text-decoration:none;box-shadow:0 6px 20px rgba(255,0,51,.35)}
.yt svg{width:22px;height:22px}
.ytb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:12px;padding:10px 22px 10px 14px;border-radius:999px;background:rgba(14,12,22,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,0,51,.6);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap;animation:ytp 2.8s ease-in-out infinite;transition:opacity .5s}
.ytb svg{width:34px;height:34px}
@keyframes ytp{50%{box-shadow:0 0 34px rgba(255,0,51,.55)}}
body.busy .ytb{opacity:0;pointer-events:none}
main{padding-bottom:64px}
@media(max-width:820px){.yt span{display:none}.yt{padding:8px 10px}.ytb{font-size:13px;padding:8px 16px 8px 10px}.ytb svg{width:28px}}
</style>
</head>

/* ============ randomness: Web Crypto, rejection sampling (no modulo bias) ============ */
function secureInt(n){const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return{index:a[0]%n,raw:a[0]}}

let AC;function beep(f,d=.08,v=.04,type="sine",when=0){if(!S.sound)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+when+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+d)}catch{}}
const chord=()=>[523,659,784,1047].forEach((f,i)=>beep(f,.7,.05,"triangle",i*.09));

/* ============ the search sequence ============ */
async function start(){
  if(running||document.body.classList.contains("busy")&&0)return;
  if(!ALL.length){alert(t("err"));return}
  const pool=eligible();
  if(!pool.length){document.body.classList.add("none");return}
  running=true;document.body.classList.remove("show","none");
  // THE ACTUAL DRAW — happens before the animation, from the real eligible pool
  const {index,raw}=secureInt(pool.length), winner=pool[index], seed=String(raw%1000000).padStart(6,"0");
  const rec={id:winner.id,name:winner.name,date:new Date().toISOString(),filters:{city:S.city,postcodes:[...S.pcs],types:[...S.types],cuisine:S.cuisine,minRating:S.minR,maxPrice:S.maxP,avoidPrevious:S.avoid},eligibleCount:pool.length,seed};
  current={r:winner,rec};
  document.body.classList.add("busy");closePops();beep(220,.4,.05,"sawtooth");
  await animate(pool,winner);
  hist.unshift(rec);hist=hist.slice(0,200);store.set("hist",hist);
  showResult();running=false;
}
function animate(pool,winner){
  return new Promise(done=>{
    const n=pool.length,cv=$("#cv"),ctx=cv.getContext("2d"),cnt=$("#cnt"),st=$("#st");
    const rm=S.rm,dpr=Math.min(devicePixelRatio||1,2);
    const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
    // stage counts: n → ... → 1
    let c=[n,Math.ceil(n*.34),Math.ceil(n*.11),7,3,1].filter((v,i,a)=>v>=1&&(i===0||v<a[i-1]));
    if(c[c.length-1]!==1)c.push(1);
    const P=Math.min(n,260),cx=W/2,cy=H/2,rx=Math.min(W*.46,520),ry=Math.min(H*.4,300);
    const dots=[...Array(P)].map((_,i)=>{const a=fx(6283)/1000,d=Math.sqrt(fx(1000)/1000);return{x:cx+Math.cos(a)*d*rx,y:cy+Math.sin(a)*d*ry*(.9+Math.sin(a*2)*.1),a:0,ph:fx(628)/100}});
    // winner is dot 0 (kept alive to the end); others are eliminated in random order
    const order=[0,...dots.map((_,i)=>i).slice(1).sort(()=>fx(3)-1)];
    const total=rm?1400:6200,stageT=rm?1400/c.length:(total-1100)/c.length,t0=performance.now();let si=-1,last=0;
    const names=pool.map(r=>r);
    function setStage(i){
      si=i;const v=c[i];cnt.textContent=v;cnt.classList.remove("tick");void cnt.offsetWidth;cnt.classList.add("tick");
      st.textContent=i===0?t("scan").replace("{c}",S.city.toUpperCase()):i<c.length-1?(i<3?t("srch"):t("narrow")):t("found");beep(300+i*90,.12,.05);
    }
    function frame(now){
      const e=Math.max(0,now-t0);
      const i=Math.min(c.length-1,Math.floor(e/stageT));if(i!==si)setStage(i);
      const keep=Math.max(1,Math.ceil(P*c[si]/n)),set=new Set(order.slice(0,keep));
      const fin=e>total-1100;
      ctx.clearRect(0,0,W,H);
      // radar pulses
      const pu=(e%1100)/1100;ctx.strokeStyle=`rgba(255,201,51,${.28*(1-pu)})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(cx,cy,rx*pu,ry*pu,0,0,6.283);ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.05)";[.35,.7,1].forEach(k=>{ctx.beginPath();ctx.ellipse(cx,cy,rx*k,ry*k,0,0,6.283);ctx.stroke()});
      const alive=[];
      dots.forEach((d,k)=>{const on=set.has(k);d.a+=((on?1:0)-d.a)*.12;if(d.a<.02)return;
        const isW=k===0,g=fin&&isW;if(on)alive.push(d);
        const x=g?d.x+(cx-d.x)*Math.min(1,(e-(total-1100))/700):d.x+Math.sin(e/700+d.ph)*3,y=g?d.y+(cy-d.y)*Math.min(1,(e-(total-1100))/700):d.y+Math.cos(e/800+d.ph)*3;
        d.dx=x;d.dy=y;ctx.globalAlpha=d.a*(fin&&!isW?0:1);ctx.fillStyle=isW&&si>c.length-3?"#ffc933":on?"#ffe6a8":"#9aa";
        ctx.shadowColor="#ffc933";ctx.shadowBlur=on?10:0;ctx.beginPath();ctx.arc(x,y,(isW&&si>=c.length-2?4+(si===c.length-1?4:0):2.2),0,6.283);ctx.fill()});
      ctx.shadowBlur=0;
      // network lines between surviving neighbours
      if(!rm&&!fin&&alive.length<90){ctx.strokeStyle="rgba(255,201,51,.22)";ctx.lineWidth=1;for(let a=0;a<alive.length;a++)for(let b=a+1;b<alive.length;b++){const dx=alive[a].dx-alive[b].dx,dy=alive[a].dy-alive[b].dy;if(dx*dx+dy*dy<(alive.length<12?60000:9000)){ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(alive[a].dx,alive[a].dy);ctx.lineTo(alive[b].dx,alive[b].dy);ctx.stroke()}}}
      ctx.globalAlpha=1;
      // flickering candidate cards (cosmetic only)
      if(!rm&&!fin&&now-last>(si<3?110:si<5?260:600)){last=now;const r=names[fx(names.length)],el=document.createElement("div");el.className="cd";
        el.innerHTML=`<b>${esc(r.name)}</b><i>${typeL(r.type)} · ${esc(r.city)} ${r.postcode}</i>`;
        const a=fx(6283)/1000,d=.45+fx(500)/1000;el.style.left=Math.max(8,Math.min(W-170,cx+Math.cos(a)*rx*d*1.05-80))+"px";el.style.top=Math.max(8,Math.min(H-50,cy+Math.sin(a)*ry*d*1.2-20))+"px";$("#stage").appendChild(el);setTimeout(()=>el.remove(),950);beep(700+fx(500),.03,.015)}
      if(e<total)requestAnimationFrame(frame);else{$$(".cd").forEach(x=>x.remove());done()}
    }
    requestAnimationFrame(frame);
  });
}

  <div class="acts"><button class="pri" id="ac">${t("accept")}</button><button id="ag">${t("again")}</button><button id="mp">${t("map")}</button></div>`;
  $("#ac").onclick=()=>{$("#nt").textContent=t("going");chord()};
  $("#ag").onclick=()=>$("#md").classList.add("on");
  $("#mp").onclick=()=>openLink("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.name+", "+where));
  $("#ac").focus();
}
const reset=()=>document.body.classList.remove("show","busy","none");
function openDr(m){const dr=$("#dr");if(dr.classList.contains("on")&&drMode===m){dr.classList.remove("on");return}drMode=m;$("#dh").textContent=m==="h"?t("history"):t("svT");renderDr();dr.classList.add("on")}
function renderDr(){
  $("#dh").textContent=drMode==="h"?t("history"):t("svT");
  const L=drMode==="h"?hist:saved;
  $("#hl").innerHTML=L.length?L.map(h=>drMode==="h"?`<div class="hi"><b>${esc(h.name)}</b>${new Date(h.date).toLocaleString(S.lang==="fa"?"fa-IR":"en-NZ")}<br>${esc(h.filters.city)}${h.filters.postcodes.length?" · "+h.filters.postcodes.join(","):""}${h.filters.types.length?" · "+h.filters.types.map(typeL).join(","):""}<br>${t("seed")} ${h.seed} · ${t("elig")} ${h.eligibleCount}</div>`:`<div class="hi"><b>${esc(h.name)}</b>${esc(h.address)}</div>`).join(""):`<p style="color:var(--dim)">${t("noHist")}</p>`;
}

/* ============ external links (popups can be blocked inside embedded pages → show a copyable fallback) ============ */
function openLink(url){
  let w=null;try{w=window.open(url,"_blank")}catch{}
  if(w){try{w.opener=null}catch{}return}
  const d=document.createElement("div");d.className="md on";
  d.innerHTML=`<div><p style="word-break:break-all;user-select:all;font-size:13px">${esc(url)}</p><div class="acts" style="justify-content:center"><a class="tb on" href="${esc(url)}" target="_blank" rel="noopener" style="text-decoration:none">${t("open")}</a><button class="tb" id="cpy">${t("copy")}</button><button class="tb" id="cls">✕</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector("#cls").onclick=()=>d.remove();
  d.querySelector("#cpy").onclick=async e=>{try{await navigator.clipboard.writeText(url);e.target.textContent="✓"}catch{const r=document.createRange();r.selectNodeContents(d.querySelector("p"));getSelection().removeAllRanges();getSelection().addRange(r)}};
}
$$("#ytTop,#ytBot").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();openLink(CONFIG.youtubeUrl)}));
/* ============ events ============ */
document.addEventListener("click",e=>{
  const o=e.target.closest(".o");
  if(o){const k=o.dataset.k,v=o.dataset.v;
    if(k==="city"){S.city=v;S.pcs.clear();closePops()}
    else if(k==="pc"){if(!v)S.pcs.clear();else S.pcs.has(v)?S.pcs.delete(v):S.pcs.add(v)}
    else S.types.has(v)?S.types.delete(v):S.types.add(v);
    document.body.classList.remove("none");summ();if(k!=="city"){const q=$("#p-"+k+" .ps");fill(k,q?q.value:"")}return}
  const fb=e.target.closest(".fb");if(fb){openPop(fb.dataset.k);return}
  if(!e.target.closest(".pop"))closePops();
});
document.addEventListener("input",e=>{if(e.target.classList.contains("ps"))fill(e.target.dataset.k,e.target.value)});
$("#hclr").onclick=()=>{if(drMode==="h"){hist=[];store.set("hist",hist)}else{saved=[];store.set("saved",saved)}renderDr()};
$("#lang").onclick=()=>{S.lang=S.lang==="en"?"fa":"en";store.set("lang",S.lang);applyLang()};
$("#go").onclick=start;$("#cta").onclick=start;
$("#y").onclick=()=>{$("#md").classList.remove("on");reset();start()};$("#n").onclick=()=>$("#md").classList.remove("on");
$("#wide").onclick=$("#clr").onclick=()=>{S.pcs.clear();S.types.clear();document.body.classList.remove("none");summ()};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closePops();$("#dr").classList.remove("on");$("#md").classList.remove("on");return}
  if(["INPUT","SELECT","BUTTON","TEXTAREA"].includes(e.target.tagName))return;
  if((e.key==="Enter"||e.key===" ")&&!document.body.classList.contains("show")&&!document.body.classList.contains("busy")){e.preventDefault();start()}
});

/* ============ boot ============ */
(async()=>{
  initBg();initPops();$$("#ytTop,#ytBot").forEach(a=>a.href=CONFIG.youtubeUrl);
  try{ALL=await DataSource.list()}catch{ALL=[]}
  if(!ALL.length)document.body.classList.add("none");
  applyLang();
  if(!ALL.length)$("#empty h2").textContent=t("err");
})();

</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
